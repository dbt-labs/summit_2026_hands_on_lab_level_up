version: 2

models:
  - name: dim_players
    description: Conformed player dimension -- one row per player, with lifetime activity and spend rolled up.
    columns:
      - name: player_id
        data_tests: [unique, not_null]
      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: account_status
        description: Source-reported status. Can diverge from is_churned, which is computed from actual session activity.
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'dormant', 'churned', 'banned']
      - name: payer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['whale', 'dolphin', 'minnow', 'non_payer']
      - name: favorite_title_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id

  - name: dim_titles
    description: Conformed title dimension -- one row per game, with rolled-up activity and a derived lifecycle_stage.
    columns:
      - name: title_id
        data_tests: [unique, not_null]
      - name: monetization_model
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'f2p', 'premium_plus_dlc']
      - name: lifecycle_stage
        description: >
          Derived stage: launch_window (<=90 days old) -> sunset_candidate
          (quiet 60+ days and >365 days old) -> growth (<=365 days old) ->
          mature (active_players_last_90d over threshold) -> declining.
        data_tests:
          - accepted_values:
              arguments:
                values: ['launch_window', 'sunset_candidate', 'growth', 'mature', 'declining']

  - name: dim_platforms
    description: Conformed platform (storefront) dimension.
    columns:
      - name: platform_id
        data_tests: [unique, not_null]
      - name: platform_family
        data_tests:
          - accepted_values:
              arguments:
                values: ['pc', 'console', 'mobile']

  - name: dim_skus
    description: Conformed SKU dimension.
    columns:
      - name: sku_id
        data_tests: [unique, not_null]
      - name: title_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id

  - name: dim_dates
    description: Date spine covering the studio's history window, one row per calendar day.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]

  - name: fct_play_sessions
    description: One row per play session.
    columns:
      - name: session_id
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: session
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
        entity:
          type: foreign
          name: player
      - name: title_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id

        entity:
          type: foreign
          name: title
      - name: session_start_at
        dimension:
          type: time
        granularity: day
    semantic_model:
      enabled: true
    agg_time_dimension: session_start_at
    metrics:
      - name: cohort_players
        type: simple
        label: Cohort Players
        agg: count_distinct
        expr: "case when week_offset_from_registration = 0 then player_id end"
      - name: week4_returned_players
        type: simple
        label: Week 4 Returned Players
        agg: count_distinct
        expr: "case when week_offset_from_registration = 4 then player_id end"
      - name: monthly_active_players
        type: simple
        label: Monthly Active Players
        agg: count_distinct
        expr: player_id
      - name: session_count
        agg: count
        expr: session_id
        type: simple
        hidden: true
      - name: valid_session_count
        agg: count
        expr: "case when is_valid_session then session_id end"
        type: simple
        hidden: true
      - name: play_minutes
        agg: sum
        expr: duration_minutes
        type: simple
        hidden: true
      - name: week_4_retention
        description: Share of a registration cohort still playing in week 4.
        type: ratio
        label: Week 4 Retention
        numerator: week4_returned_players
        denominator: cohort_players
  - name: fct_transactions
    description: One row per transaction.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: transaction
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
        entity:
          type: foreign
          name: player
      - name: title_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id
        entity:
          type: foreign
          name: title
      - name: transaction_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium_purchase', 'iap', 'season_pass', 'dlc', 'refund', 'chargeback']

      - name: transaction_at
        dimension:
          type: time
        granularity: day
    semantic_model:
      enabled: true
    agg_time_dimension: transaction_at
    metrics:
      - name: net_revenue
        type: simple
        label: Net Revenue
        agg: sum
        expr: net_amount_usd
      - name: paying_players
        type: simple
        label: Paying Players
        agg: count_distinct
        expr: "case when is_live_service_revenue then player_id end"
      - name: gross_revenue
        agg: sum
        expr: gross_amount_usd
        type: simple
        hidden: true
      - name: studio_net_revenue
        agg: sum
        expr: studio_net_revenue_usd
        type: simple
        hidden: true
      - name: arppu
        description: Average net revenue per paying player.
        type: ratio
        label: ARPPU
        numerator: net_revenue
        denominator: paying_players
  - name: fct_high_scores
    description: One row per leaderboard submission, ranked/percentiled excluding cheat-flagged rows.
    columns:
      - name: score_id
        data_tests: [unique, not_null]
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: title_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id

  - name: fct_releases
    description: One row per patch/content drop, with a +-10 day before/after engagement comparison.
    columns:
      - name: release_id
        data_tests: [unique, not_null]
      - name: title_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id
      - name: release_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['major', 'minor', 'hotfix', 'content_drop', 'event']
